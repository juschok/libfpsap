name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # needed to create a Release on tag

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    os: linux,  arch: amd64, suf: so }
          - { runner: ubuntu-24.04-arm, os: linux,  arch: arm64, suf: so }
          - { runner: macos-latest,     os: darwin, arch: arm64, suf: dylib }
    steps:
      - uses: actions/checkout@v4

      - name: Build libfpsap
        run: make

      - name: Offline conformance (golden vectors)
        run: make check

      - name: Stage release artifact
        run: |
          mkdir -p dist
          cp "lib/${{ matrix.os }}/${{ matrix.arch }}/libfpsap.${{ matrix.suf }}" \
             "dist/libfpsap-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.suf }}"

      - uses: actions/upload-artifact@v4
        with:
          name: libfpsap-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release with built libs
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
