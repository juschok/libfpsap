name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # needed to create a Release on tag

jobs:
  build:
    name: ${{ matrix.tag }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc (GNU) builds — host toolchain on the GitHub runners
          - { runner: ubuntu-latest,    os: linux,  arch: amd64, suf: so,    libc: gnu,  tag: linux-amd64 }
          - { runner: ubuntu-24.04-arm, os: linux,  arch: arm64, suf: so,    libc: gnu,  tag: linux-arm64 }
          # musl builds — compiled inside Alpine (matches musl-based runtimes
          # such as Alpine containers; a glibc .so cannot dlopen there)
          - { runner: ubuntu-latest,    os: linux,  arch: amd64, suf: so,    libc: musl, tag: linux-amd64-musl }
          - { runner: ubuntu-24.04-arm, os: linux,  arch: arm64, suf: so,    libc: musl, tag: linux-arm64-musl }
          # macOS
          - { runner: macos-latest,     os: darwin, arch: arm64, suf: dylib, libc: none, tag: darwin-arm64 }
    steps:
      - uses: actions/checkout@v4

      # Host toolchain (glibc on Ubuntu, clang on macOS).
      - name: Build + conformance (host toolchain)
        if: matrix.libc != 'musl'
        run: |
          make
          make check

      # musl: build inside an Alpine container of the runner's native arch.
      # Done via `docker run` (not the job-level `container:`) because Alpine
      # has no Node.js for JavaScript actions; the build itself needs none.
      - name: Build + conformance (Alpine/musl)
        if: matrix.libc == 'musl'
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.23 sh -c '
            apk add --no-cache build-base &&
            make clean &&
            make &&
            make check'

      - name: Stage release artifact
        run: |
          mkdir -p dist
          cp "lib/${{ matrix.os }}/${{ matrix.arch }}/libfpsap.${{ matrix.suf }}" \
             "dist/libfpsap-${{ matrix.tag }}.${{ matrix.suf }}"

      - uses: actions/upload-artifact@v4
        with:
          name: libfpsap-${{ matrix.tag }}
          path: dist/*

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release with built libs
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
